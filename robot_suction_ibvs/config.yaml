# All distance and velocity values use mm / mm/s. Image positions use px.
camera:
  width: 3840
  height: 2160
  fps: 30
  device_id:  "/dev/video6"
  video_path: null
  enable_undistort: false
  intrinsic_path: data/camera_intrinsic.npz

vision:
  # OpenCV HSV 黑色范围：不限制色相和饱和度，只筛选低亮度像素。
  # 如果阴影也被识别，可把 V 上限从 80 调低到 50~70。
  hsv_lower: [0, 0, 0]
  hsv_upper: [179, 255, 80]
  min_area_px: 100.0
  morphology_kernel: 3
  size_threshold_px: 200.0

tracking:
  max_distance_px: 80.0
  max_lost_frames: 5

ibvs:
  gain: 0.5
  max_velocity_mm_s: 5.0
  min_velocity_mm_s: 0.0
  pixel_tolerance: 5.0
  stable_frames: 5
  max_align_time_s: 15.0
  error_growth_frames: 10
  slowdown_error_px: 10.0
  max_acceleration_mm_s2: 20.0
  servo_A_path: data/servo_A.npy

robot:
  # Replace these six values to match the pose format expected by the real robot SDK.
  observe_pose: [0.0, 0.0, 150.0, 0.0, 0.0, 0.0]
  observe_z_mm: 150.0
  pick_z_mm: 35.0
  safe_z_mm: 150.0
  z_mode: absolute
  z_down_speed_mm_s: 2.0
  z_up_speed_mm_s: 5.0

suction:
  hold_time_s: 0.5
  suction_ref_path: data/suction_ref.npy

safety:
  max_xy_travel_mm: 30.0
  camera_failure_limit: 3

system:
  show_debug: true
  show_mask: false
  save_csv: true
  loop_hz: 30.0
